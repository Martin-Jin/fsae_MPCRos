# Central parameter config for the FSAE autonomous system.
#
# This is the single source of truth for tunable parameters (decision: central
# config lives in fsae_bringup, not per-package). Launch files in fsae_bringup
# load this file and pass it to the relevant nodes.
#
# STARTER ONLY - values below are the currently-hardcoded numbers identified in
# the old repo (see "OPEN QUESTIONS" in refactor plan.txt). They are populated
# package-by-package during Stage 2 as each node's params are extracted from code.
# Node keys are placeholders until the Stage 2 node names are finalised.

# --- control/fsae_control (Stanley controller) ---
# Node name is 'stanley_controller'. Values extracted from the old
# stanley_controller.py (k_speed was unused and dropped).
stanley_controller:
  ros__parameters:
    target_velocity: 8.0        # m/s (old code default; open Q: car runs 9.0/10.0 - confirm)
    stanley_gain: 5.0           # was k_stanley
    front_axle_dist: 1.0        # m, camera to front axle (was cam_fron_axle_dist)
    max_steer_angle: 30.0       # degrees (was max_steer)

# --- planning/fsae_planning (three planners; node name == executable name) ---
# 'plot' enables matplotlib output - set false on the car (headless).
fasttube:
  ros__parameters:
    look_forward: 6
    plot: false
    invert_cones: false
fasttube_without_kalman:        # SLAM fallback - reads raw camera detections
  ros__parameters:
    look_forward: 4
    plot: false
centerline_planner:
  ros__parameters:
    look_forward: 4
    smoothing_factor: 1.0
    plot: false

# --- control/fsae_can_bridge ---
# Keys are node names: ack_to_can's node is 'ackermann_to_can'.
ackermann_to_can:
  ros__parameters:
    can_id: 768                 # command frame id = 0x300. Old launches ALL passed
                                # default_value='0x300' (the node default of 300 was always
                                # overridden), so the car listens on 768. Refactor had baked in
                                # the unused node default (300) - restored to 768 to match.
can_decoder:
  ros__parameters:
    battery_main_id: 0x6b0      # current/voltage
    battery_cells_id: 0x6b3     # cell count
    battery_temp_id: 0x6b4      # temperature
    drive_speed_id: 0x604
    drive_steer_id: 0x605
    glv_id: 0x602
    battery_msg_count: 4        # frames collected before publishing battery state
    drive_msg_count: 3          # frames collected before publishing drive state
candapter_node:               # CAN hardware bridge (ported from CanTalk). Jetson-only.
  ros__parameters:
    port: "/dev/ttyUSB0"        # CANdapter USB-serial device
    baud_rate: 250              # CAN bitrate in kbit/s (-> 'S5'); NOT the USB serial line speed
autonomous_sys_status:
  ros__parameters: {}           # no tunables yet
joystick_teleop:
  ros__parameters:
    max_speed: 2.0
    max_angle: 22.0
    use_ds4drv: true
    verbose: false

# --- perception/fsae_camera (ZED cone detection; node name 'cone_detection_node') ---
cone_detection_node:
  ros__parameters:
    # Path to the TensorRT engine on the Jetson. NOT committed (GPU-specific) - set to the
    # real location. Was hardcoded "cone_detection_model.engine" in zed_launch.hpp.
    engine_path: "/home/fsae/ros2_ws/cone_detection_model.engine"
    conf_threshold: 0.4           # YOLO confidence gate (tune 0.55-0.65 on car)
    max_cone_distance: 25.0        # metres; drop cones farther than this
    visualise: true                # publish annotated debug image
    # Ground-plane fit (RANSAC) — reconstructs the SDK's dropped is_grounded floor anchoring.
    # Each cone is positioned by intersecting its base ray with the fitted plane; a weak fit
    # falls back to per-cone median depth. Watch the throttled "ground plane: height=.. tilt=.."
    # log on the car: height should ≈ the camera mounting height and tilt should be small.
    ground_fit_enable: true        # false = always use per-cone box-centre depth (old behaviour)
    ground_ransac_iters: 120       # RANSAC trials per frame (more = steadier fit, more CPU)
    ground_inlier_thresh: 0.05     # m; point-to-plane distance to count as an inlier
    ground_min_inliers: 600        # below this the fit is 'weak' → fall back to per-cone depth
    ground_subsample_step: 8       # px stride when building the cloud (larger = cheaper, coarser)
    ground_max_tilt_deg: 20.0      # gravity prior: reject planes tilted more than this from level
    ground_contact_offset_px: 1    # moves the base contact pixel DOWN this many depth-image px before the
                                   # ground-plane ray hit. Basically the depth of the cone at the base was wrong
                                   # but the depth of the ground one pixel in front of the cone is accurate so
                                   # we instead use that pixel to get the correct depth. This is a bit jank
                                   # but until either the yolo is retrained or the zed is recalibrated this is
                                   # GOOD ENOUGH. for 720p shift 1px for 1080 shift 2px

    # --- DEBUG params (console diagnostics; all prefixed debug_, keep false for normal runs) ---
    debug_depth_grid: false        # print an ASCII grid of raw depth-image values over each cone's box every
                                   # frame (metres, downsampled). Floods the console at frame rate — tuning only.
    debug_ground_plane_log: false  # print the throttled "ground plane: height/tilt/inliers" INFO line.
                                   # (The weak-fit WARN is separate and always shown, even when this is false.)
    # Wrapper topic names - CONFIRMED against the wrapper's startup log on the Jetson
    # (2026-07-02). NOTE: this zed-ros2-wrapper version does NOT publish left/image_rect_color
    # by default ('Publish Left/Right images: FALSE') - the rectified colour stream is the
    # rgb/ alias below (BGRA 32-bit, from the left sensor).
    image_topic: "/zed/zed_node/rgb/color/rect/image"
    depth_topic: "/zed/zed_node/depth/depth_registered"
    camera_info_topic: "/zed/zed_node/rgb/color/rect/camera_info"
    pose_topic: "/zed/zed_node/pose"

# --- perception: zed_ros2_wrapper SDK overrides (the wrapper's own node) ---
# Passed to the wrapper via its `ros_params_override_path` launch arg (see
# perception.launch.py); the wrapper appends it LAST, so these keys win over its
# own common_stereo.yaml / zed2i.yaml defaults. Keyed to the wrapper node's FQN
# ('/zed/zed_node') NOT '/**' on purpose: this is the central config file, so a
# wildcard would leak camera params onto every other node that loads it.
#
# Why NEURAL: the pre-wrapper node drove the SDK with sl::DEPTH_MODE::ULTRA, a
# deprecated 5.x alias that warns and silently runs NEURAL. Requesting NEURAL is
# the faithful port; otherwise the wrapper defaults to NEURAL_LIGHT on Jetson.
"/zed/zed_node":
  ros__parameters:
    general:
      # HD1080 caps at 30 fps on the ZED 2i (HD720 was 60). 1080p ~doubles the
      # depth-map pixels vs 720p (better far-range density) at ~2x NEURAL compute.
      # Verify the Jetson sustains 30 Hz: ros2 topic hz /zed/zed_node/depth/depth_registered
      grab_resolution: 'HD720'   # 'HD2K' | 'HD1080' | 'HD720' | 'VGA' | 'AUTO'
      grab_frame_rate: 30         # HD1080 max on ZED 2i is 30
    depth:
      depth_mode: 'NEURAL'        # 'NONE'|'NEURAL_LIGHT'|'NEURAL'|'NEURAL_PLUS' (PLUS not installed)
      # NEURAL is rated to 35 m on the ZED 2i (standard 20 m), so 25 m is in spec.
      # cone_detection_node.max_cone_distance is 25 m but was capped here at 15 m —
      # cones past 15 m came back NaN and were dropped. ~<7% error at 25 m NEURAL.
      max_depth: 25.0             # was 15.0
      # Range [1,100]; LOWER rejects more low-confidence depth (100 keeps every px).
      # 80 trims marginal/edge depth feeding the ground-plane fit + median fallback,
      # so per-frame distance jitters less. Trade-off: sparser far/low-texture cones
      # (they need >=3 valid samples). Tune 70-90.
      depth_confidence: 80        # SDK default is 95
      # Temporal depth filter, range [0,100]; -1 = SDK default (30), 0 = off. Higher
      # smooths depth across frames to cut per-frame jitter (helps the ground-plane
      # fit + median fallback). Trade-off: lag on fast-changing scenes; >0 also
      # force-enables the wrapper's positional tracking.
      depth_stabilization: 30
      # cone_detection_node deprojects the depth IMAGE and never subscribes to the
      # point cloud; nothing else in the repo consumes it. Off to save CPU/bandwidth.
      publish_point_cloud: false

# --- perception/fsae_slam (cone_mapper - Python KF landmark mapper) ---
cone_mapper:
  ros__parameters:
    default_error_in_estimate: 4.0   # initial KF estimate error
    error_in_measurement: 2.5        # KF measurement error
    match_radius: 1.0                # m, nearest-landmark match radius
    remove_point_counter: 200        # frames between low-confidence prunes
    times_modified_limit: 100        # min confidence to survive a prune
    modify_rate: 1.08                # confidence growth per match
    reset_count: 60                  # frames between full map resets
    invert_cones: false              # swap blue<->yellow track assignment

# --- planning/fsae_mission_control (ported from scrutineering) ---
inspection_mission_node:
  ros__parameters:
    timeout: 10                 # s
    max_steering_angle: 45.0    # degrees
    steering_angle_velocity: 36.0  # degrees/s
    max_speed: 5.0              # m/s
    max_acceleration: 5.0       # m/s^2
    jerk: 1.0                   # m/s^3

# --- bench testing (mock stimulus, from mock_params.yaml) ---
mock_stimulus:
  ros__parameters:
    accel: 0.0
    angle: 10.0
    angular_vel: 0.0
    vel: 11.0
    verbose: false
    use_sim_time: false
